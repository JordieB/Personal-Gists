[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-tools"
version = "0.1.0"
description = "Tools for dev tools"
requires-python = ">=3.9"
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dev-tools = "dev_tools.cli:app"

[tool.setuptools.packages.find]
include = ["dev_tools*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E","F","I","UP"]

[tool.pytest.ini_options]
addopts = "-q"
